# =============================================
# Nginx - Configuração Principal
# Plataforma Imobiliária Estou em Casa
# =============================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -----------------------------------------------
    # Formato de log estruturado
    # -----------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time"';

    access_log /var/log/nginx/access.log main;

    # -----------------------------------------------
    # Configurações de performance
    # -----------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Limite de tamanho de requisição (10MB)
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    # -----------------------------------------------
    # Compressão Gzip
    # -----------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # -----------------------------------------------
    # Zones de Rate Limiting
    # Global: 100 req/min por IP
    # Auth: 10 req/min por IP (mais restritivo)
    # -----------------------------------------------
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    # -----------------------------------------------
    # Upstream - Backend NestJS
    # -----------------------------------------------
    upstream backend {
        server backend:3001;
        keepalive 32;
    }

    # -----------------------------------------------
    # Upstream - Frontend Next.js
    # -----------------------------------------------
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    # -----------------------------------------------
    # Servidor principal
    # -----------------------------------------------
    server {
        listen 80;
        server_name _;

        # Rate limiting global
        limit_req zone=global burst=50 nodelay;

        # -----------------------------------------------
        # Headers de Segurança
        # -----------------------------------------------
        # Content Security Policy
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none';" always;

        # HTTP Strict Transport Security (comentado para dev, ativar em prod)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Proteção contra clickjacking
        add_header X-Frame-Options "DENY" always;

        # Proteção contra MIME sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Política de referrer
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissões de features do browser
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;

        # Remover header X-Powered-By
        proxy_hide_header X-Powered-By;

        # -----------------------------------------------
        # Proxy para API Backend
        # -----------------------------------------------
        location /api/ {
            # Rate limiting nas rotas de autenticação
            location /api/v1/auth/ {
                limit_req zone=auth burst=5 nodelay;

                proxy_pass http://backend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
                proxy_read_timeout 30s;
                proxy_connect_timeout 10s;
            }

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # -----------------------------------------------
        # Documentação Swagger
        # -----------------------------------------------
        location /api/docs {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # -----------------------------------------------
        # WebSocket para hot reload (desenvolvimento)
        # -----------------------------------------------
        location /_next/webpack-hmr {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # -----------------------------------------------
        # Proxy para Frontend Next.js
        # -----------------------------------------------
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }

        # -----------------------------------------------
        # Health check do nginx
        # -----------------------------------------------
        location /nginx-health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
